services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: heart_of_india
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heart_of_india"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - heart_of_india_pg:/var/lib/postgresql/data
volumes:
  heart_of_india_pg:
